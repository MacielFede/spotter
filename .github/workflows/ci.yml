name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # Version is read from package.json's packageManager field.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter phone typecheck
      - run: pnpm test

  codegen-drift:
    name: Codegen drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Guards the schema-first invariant (ADR 0012/0017): regenerate and
      # fail if committed artifacts differ from what the Zod sources produce.
      - run: pnpm codegen
      - run: git diff --exit-code

  fixtures:
    name: Shared golden fixtures (ADR 0046)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # TODO(#75): run the shared golden fixtures against every platform's
      # behavior tests once they exist. `test:fixtures` is a no-op until then.
      - run: pnpm test:fixtures

  wearos:
    name: Wear OS unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/wearos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDebugUnitTest
